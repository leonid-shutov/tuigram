name: Feature request
description: Something tuigram could do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you'd like
      description: What you want to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How it could work
      description: Keys, config, what it looks like on screen — whatever you have in mind. Optional.
