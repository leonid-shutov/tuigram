version: 2
updates:
  - package-ecosystem: npm
    directory: /
    versioning-strategy: increase
    schedule:
      interval: weekly
    groups:
      opentui:
        patterns: ['@opentui/*']
      mtcute:
        patterns: ['@mtcute/*']
      npm:
        patterns: ['*']
        exclude-patterns: ['@opentui/*', '@mtcute/*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
