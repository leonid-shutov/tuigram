name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for trusted publishing / provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm install -g npm@latest # trusted publishing needs npm >= 11.5.1
      - run: npm ci
      - name: Verify tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "tag $tag != package.json $pkg"; exit 1; }
      - name: Write the shipped app key
        run: node scripts/write-app-key.js
        env:
          TUIGRAM_SHIPPED_API_ID: ${{ secrets.TUIGRAM_SHIPPED_API_ID }}
          TUIGRAM_SHIPPED_API_HASH: ${{ secrets.TUIGRAM_SHIPPED_API_HASH }}
      - run: npm publish

  bump-formula:
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }} # prereleases stay off Homebrew
    steps:
      - uses: actions/checkout@v7
        with:
          repository: leonid-shutov/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - name: Bump Formula/tuigram.rb
        run: |
          version="${GITHUB_REF_NAME#v}"
          url="https://registry.npmjs.org/tuigram/-/tuigram-$version.tgz"
          # the registry CDN can lag a few seconds behind `npm publish`
          for _ in $(seq 30); do
            curl -fsSL "$url" -o "$RUNNER_TEMP/pkg.tgz" && break
            sleep 10
          done
          sha="$(sha256sum "$RUNNER_TEMP/pkg.tgz" | cut -d' ' -f1)"
          sed -i -E "s|^  url \".*\"|  url \"$url\"|; s|^  sha256 \".*\"|  sha256 \"$sha\"|" \
            Formula/tuigram.rb
          git diff --quiet && { echo "formula already at $version"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "tuigram $version"
          git push

  bump-aur:
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }} # prereleases stay off the AUR too
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Bump packaging/aur/PKGBUILD and regenerate .SRCINFO
        run: |
          pacman -Sy --noconfirm --needed curl git openssh
          version="${GITHUB_REF_NAME#v}"
          url="https://registry.npmjs.org/tuigram/-/tuigram-$version.tgz"
          # the registry CDN can lag a few seconds behind `npm publish`
          for _ in $(seq 30); do
            curl -fsSL "$url" -o "$RUNNER_TEMP/pkg.tgz" && break
            sleep 10
          done
          sha="$(sha256sum "$RUNNER_TEMP/pkg.tgz" | cut -d' ' -f1)"
          sed -i -E "s|^pkgver=.*|pkgver=$version|; s|^pkgrel=.*|pkgrel=1|; s|^sha256sums=\('.*'\)|sha256sums=('$sha')|" \
            packaging/aur/PKGBUILD
          # makepkg refuses to run as root even just to print .SRCINFO
          useradd -m builder
          chown -R builder:builder packaging/aur
          su builder -c 'cd packaging/aur && makepkg --printsrcinfo > .SRCINFO'
      - name: Push to the AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p -m 700 ~/.ssh
          echo "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur -o UserKnownHostsFile=~/.ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/tuigram.git "$RUNNER_TEMP/aur-tuigram"
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO "$RUNNER_TEMP/aur-tuigram/"
          cd "$RUNNER_TEMP/aur-tuigram"
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet && { echo "AUR package already at $version"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "tuigram $version"
          git push
